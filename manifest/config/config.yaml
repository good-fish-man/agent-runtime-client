# agent-runtime-client configuration
server:
  name: "agent-runtime-client"
  http_addr: ":8090"
  mode: "debug"
  public_prefix: "/api/agent-runtime-client/v1"

runtime:
  grpc_addr: "localhost:18080"
  http_addr: "http://127.0.0.1:18081"
  request_timeout_sec: 60
  dial_timeout_sec: 5

log:
  level: "debug"

db:
  db_type: "postgres"
  username: "postgres"
  password: ""
  db_host: "127.0.0.1"
  db_port: 5432
  db_name: "agent_runtime"
  charset: "utf8mb4"
  max_open_conn: 50
  max_idle_conn: 10
  conn_max_lifetime: 500
  log_mode: 4
  slow_threshold: 10

paths:
  app_config_file: ""
  skills_config_file: ""
  uploads_dir: ""
