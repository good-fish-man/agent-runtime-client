# agent-runtime-client configuration
server:
  name: "agent-runtime-client"
  http_addr: ":8090"
  mode: "debug"
  public_prefix: "/api/agent-runtime-client/v1"

runtime:
  grpc_addr: "localhost:18080"
  http_addr: "http://127.0.0.1:18081"
  request_timeout_sec: 60
  dial_timeout_sec: 5

control:
  # Required by Athena Desktop when connecting to /v1/control/device.
  device_token: ""

scheduled_task:
  # Cron expressions are minute-granularity, so 60s avoids noisy DB polling.
  scan_interval_sec: 60

orchestration:
  # Durable goals run through the bounded Supervisor and checkpoint every state transition.
  enabled: true
  scan_interval_sec: 3
  max_concurrent_runs: 2

evolution:
  # Discovers declarative Skill candidates from independent Experience records.
  # Candidates always require offline evaluation and explicit human review.
  enabled: true
  scan_interval_sec: 60
  owner_batch_size: 100
  experience_limit: 1000
  max_candidates_per_scan: 10
  minimum_novel_experiences: 2
  codex:
    # Opt in explicitly because synthesis sends bounded evidence to OpenAI and incurs API usage.
    # Codex only proposes declarative artifacts; it cannot generate executable code or deploy them.
    enabled: false
    model: "gpt-5.3-codex"
    api_key: "${OPENAI_API_KEY}"
    api_base: "https://api.openai.com/v1"
    reasoning_effort: "medium"
    timeout_sec: 120
    max_output_tokens: 4096

plugins:
  # Signed, immutable Capability Provider packages. Empty values use ~/.athena/plugins.
  directory: ""
  registry_path: ""
  trust_store_path: ""
  audit_path: ""

operations:
  # Launcher fills these paths for managed local installations. Server
  # administrators can set them explicitly for remote deployments.
  backup_dir: ""
  encryption_key_file: ""
  pg_dump_path: "pg_dump"
  pg_restore_path: "pg_restore"
  max_backups: 10

log:
  level: "debug"

db:
  db_type: "postgres"
  username: "postgres"
  password: "a123456" # set ARC_DB_PASSWORD or let Athena Launcher generate it
  db_host: "127.0.0.1"
  db_port: 5432
  db_name: "agent_runtime"
  charset: "utf8mb4"
  max_open_conn: 50
  max_idle_conn: 10
  conn_max_lifetime: 500
  log_mode: 4
  slow_threshold: 10

paths:
  app_config_file: ""
  skills_config_file: ""
  uploads_dir: ""
