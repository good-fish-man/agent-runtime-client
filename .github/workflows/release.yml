name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.5
        required: true
        default: v0.1.5

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          set -euo pipefail
          go mod tidy
          go clean -modcache
          go mod download
          name="agent-runtime-client_${RELEASE_TAG}_${GOOS}_${GOARCH}"
          mkdir -p "package/$name" dist
          extension=""
          if [ "$GOOS" = "windows" ]; then extension=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "package/$name/agent-runtime-client$extension" .
          cp README.md README.zh-CN.md LICENSE NOTICE THIRD_PARTY_NOTICES.md "package/$name/"
          cp -R manifest "package/$name/manifest"
          if [ "$GOOS" = "windows" ]; then
            (cd package && zip -qr "../dist/$name.zip" "$name")
          else
            tar -C package -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: agent-runtime-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
